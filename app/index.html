<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ATLETA</title>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d0d0d">
<meta name="description" content="Combustível, micronutrientes e eixo intestino-cérebro traduzidos em consequência de treino.">

<!-- iOS não lê tudo do manifest; precisa destas -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ATLETA">
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
<link rel="icon" href="icones/favicon-32.png" sizes="32x32">

<style>
  :root{
    color-scheme:dark;
    --plane:#0d0d0d; --surface:#1a1a19; --surface-2:#222220; --surface-3:#2a2a27;
    --ink:#fff; --ink-2:#c3c2b7; --muted:#898781; --border:rgba(255,255,255,.10);
    --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
    --s1:#3987e5; --brand:#199e70;
    --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --topo:env(safe-area-inset-top);
    --base:env(safe-area-inset-bottom);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overscroll-behavior-y:none}
  body{
    background:var(--plane);color:var(--ink);font-family:var(--font);line-height:1.45;
    display:flex;flex-direction:column;
  }

  header{
    padding:calc(14px + var(--topo)) 18px 12px;flex:none;
    display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
    border-bottom:1px solid var(--border);
  }
  header h1{margin:0;font-size:18px;font-weight:650;letter-spacing:-.01em}
  header .sub{color:var(--muted);font-size:11.5px;margin-top:2px}
  #instalar{
    display:none;flex:none;font-family:inherit;font-size:11.5px;font-weight:640;cursor:pointer;
    background:rgba(25,158,112,.14);border:1px solid rgba(25,158,112,.45);color:var(--brand);
    border-radius:999px;padding:7px 13px;
  }

  main{flex:1;overflow-y:auto;padding:14px 16px calc(84px + var(--base));-webkit-overflow-scrolling:touch}
  .aba{display:none} .aba.on{display:block}

  .sec{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
       font-weight:650;margin:22px 2px 9px}
  .sec:first-child{margin-top:2px}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:15px;
        margin-bottom:10px;border-left-width:3px;border-left-style:solid}
  .card.critico{border-left-color:var(--critical)}
  .card.serio{border-left-color:var(--serious)}
  .card.atencao{border-left-color:var(--warning)}
  .card.info{border-left-color:var(--s1)}
  .card.bom{border-left-color:var(--good)}
  .card h3{margin:0 0 10px;font-size:15px;font-weight:645;line-height:1.35}
  .fld{margin:0 0 10px;font-size:13px;color:var(--ink-2);line-height:1.6}
  .fld:last-of-type{margin-bottom:0}
  .fld em{font-style:normal;display:block;font-size:10px;letter-spacing:.09em;text-transform:uppercase;
          color:var(--muted);font-weight:650;margin-bottom:3px}
  .src{font-size:10.5px;color:var(--muted);margin-top:11px;padding-top:10px;
       border-top:1px solid var(--border);line-height:1.5}

  .liso{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:15px;margin-bottom:10px}
  .vazio{color:var(--muted);font-size:13px;line-height:1.6;padding:14px 2px}

  .pedido{background:rgba(57,135,229,.10);border:1px solid rgba(57,135,229,.30);border-radius:14px;
          padding:12px 14px;margin-bottom:8px;font-size:12.8px;color:var(--ink-2);line-height:1.55}
  .pedido b{color:var(--ink);font-weight:600}

  /* ---- formulário ---- */
  .grupo{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:6px 14px;margin-bottom:10px}
  .campo{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border)}
  .campo:last-child{border-bottom:0}
  .campo .rot{flex:1;min-width:0;font-size:13px}
  .campo .rot small{display:block;color:var(--muted);font-size:10.5px;margin-top:1px}
  .campo input,.campo select{
    background:var(--surface-2);border:1px solid var(--border);color:var(--ink);
    border-radius:9px;padding:8px 9px;font-family:inherit;font-size:13px;
    width:92px;text-align:right;font-variant-numeric:tabular-nums;
  }
  .campo input[type=date]{width:132px;font-size:12px;text-align:left}
  .campo select{width:auto;min-width:112px;text-align:left}
  .campo input:focus,.campo select:focus{outline:none;border-color:rgba(25,158,112,.55)}
  .campo .dupla{display:flex;gap:6px;align-items:center}

  .btn{
    font-family:inherit;font-size:13px;font-weight:640;border-radius:12px;padding:12px 16px;cursor:pointer;
    background:var(--surface);border:1px solid var(--border);color:var(--ink-2);width:100%;margin-bottom:8px;
  }
  .btn:active{background:var(--surface-2)}
  .btn.brand{background:linear-gradient(150deg,#199e70,#12775a);border-color:rgba(25,158,112,.45);color:#fff}
  .btn.perigo{color:var(--critical);border-color:rgba(208,59,59,.35)}
  .linha2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .linha2 .btn{margin-bottom:0}

  .aviso{border:1px dashed var(--border);border-radius:14px;padding:14px;font-size:12px;
         color:var(--muted);line-height:1.6}
  .aviso b{color:var(--ink-2)}

  .row{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:9px 12px;
       margin-bottom:6px;display:flex;gap:10px;align-items:baseline;font-size:12px}
  .row code{font-family:ui-monospace,Consolas,monospace;font-size:11px}
  .row .why{color:var(--muted);font-size:11px;margin-left:auto;text-align:right}

  nav{
    position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);
    background:rgba(13,13,13,.92);backdrop-filter:blur(14px);border-top:1px solid var(--border);
    padding:8px 4px calc(8px + var(--base));z-index:10;
  }
  nav button{
    background:none;border:0;color:var(--muted);font-family:inherit;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px 2px;
    font-size:10px;font-weight:650;
  }
  nav button svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;
                 stroke-linecap:round;stroke-linejoin:round}
  nav button.on{color:var(--brand)}

  .toast{
    position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + var(--base));
    background:var(--surface-3);border:1px solid var(--border);border-radius:11px;
    padding:10px 15px;font-size:12.5px;color:var(--ink);z-index:20;
    opacity:0;pointer-events:none;transition:opacity .2s;box-shadow:0 8px 24px rgba(0,0,0,.5);
  }
  .toast.on{opacity:1}
</style>
</head>
<body>

<header>
  <div>
    <h1 id="titulo">Hoje</h1>
    <div class="sub" id="subtitulo">—</div>
  </div>
  <button id="instalar">Instalar</button>
</header>

<main>
  <section class="aba on" id="a-hoje"></section>
  <section class="aba" id="a-dados"></section>
  <section class="aba" id="a-sobre"></section>
</main>

<nav>
  <button class="on" data-aba="a-hoje" data-titulo="Hoje">
    <svg viewBox="0 0 24 24"><path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Hoje
  </button>
  <button data-aba="a-dados" data-titulo="Meus dados">
    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Dados
  </button>
  <button data-aba="a-sobre" data-titulo="Auditoria">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>Auditoria
  </button>
</nav>

<div class="toast" id="toast"></div>

<script src="js/motor-regras.js"></script>
<script src="js/base-regras.js"></script>
<script src="js/armazenamento.js"></script>
<script src="js/app.js"></script>
</body>
</html>
