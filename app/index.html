<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ATLETA</title>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d0d0d">
<meta name="description" content="Combustível, micronutrientes e eixo intestino-cérebro traduzidos em consequência de treino.">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ATLETA">
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
<link rel="icon" href="icones/favicon-32.png" sizes="32x32">

<link rel="stylesheet" href="css/estilo.css">
</head>
<body>

<header>
  <div>
    <h1 id="titulo">Hoje</h1>
    <div class="sub" id="subtitulo">—</div>
  </div>
  <button id="instalar">Instalar</button>
</header>

<main>
  <section class="aba on" id="a-hoje"></section>
  <section class="aba" id="a-fuel"></section>
  <section class="aba" id="a-corpo"></section>
  <section class="aba" id="a-dados"></section>
  <section class="aba" id="a-sobre"></section>
</main>

<nav>
  <button class="on" data-aba="a-hoje" data-titulo="Hoje">
    <svg viewBox="0 0 24 24"><path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Hoje
  </button>
  <button data-aba="a-fuel" data-titulo="Combustível">
    <svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>Combustível
  </button>
  <button data-aba="a-corpo" data-titulo="Corpo">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="9" stroke-dasharray="3 3"/></svg>Corpo
  </button>
  <button data-aba="a-dados" data-titulo="Meus dados">
    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Dados
  </button>
  <button data-aba="a-sobre" data-titulo="Auditoria">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>Auditoria
  </button>
</nav>

<div class="toast" id="toast"></div>

<script src="js/motor-regras.js"></script>
<script src="js/base-regras.js"></script>
<script src="js/armazenamento.js"></script>
<script src="js/app.js"></script>
</body>
</html>
